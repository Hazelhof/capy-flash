# pre-commit install: checks every commit; CI runs the same hooks on the files a pull request changes
# (.github/workflows/lint.yml). C/C++/CUDA follow .clang-format, Python follows ruff.toml (format + lint),
# spelling follows _typos.toml. The whole-tree formatting commits are listed in .git-blame-ignore-revs.
exclude: ^third_party/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^tools/freq_corpus/fixtures/ranking/ # token rankings, one i64 per vocabulary entry (1.9 MB)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
