name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.3.0
      - name: hooks on the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD
